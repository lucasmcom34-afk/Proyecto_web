<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña – Impulso</title>
    <link rel="stylesheet" href="./recuperar.css">
    <script src="./olvido.js" defer></script>
</head>
<body>
    <main class="recuperar">
        <h2>¿Olvidaste tu contraseña?</h2>
        <p class="login-description">Ingresá tu correo y te enviamos un link para cambiarla.</p>

        <form id="forgotForm" novalidate>
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" placeholder="tu@email.com" required>
            </div>
            <p class="form-error" id="msg" role="alert" hidden></p>
            <button type="submit" class="login-button" id="btn">Enviar link</button>
        </form>

        <p class="register"><a href="../inicio_sesion/login.html">Volver a iniciar sesión</a></p>
    </main>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva contraseña – Impulso</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./recuperar.css">
    <script src="./nueva.js" defer></script>
</head>
<body>
    <main class="recuperar">
        <p class="marca">Impulso</p>
        <h2>Elegí una nueva contraseña</h2>

        <form id="resetForm" novalidate>
            <div class="form-group">
                <label for="password">Nueva contraseña</label>
                <div class="campo-clave">
                    <input type="password" id="password" minlength="8" autocomplete="new-password" required>
                    <button type="button" class="ojo" data-target="password" aria-label="Mostrar contraseña"></button>
                </div>
            </div>

            <div class="form-group">
                <label for="confirm">Repetir contraseña</label>
                <div class="campo-clave">
                    <input type="password" id="confirm" minlength="8" autocomplete="new-password" required>
                    <button type="button" class="ojo" data-target="confirm" aria-label="Mostrar contraseña"></button>
                </div>
            </div>

            <p class="form-error" id="msg" role="alert" hidden></p>
            <button type="submit" class="login-button" id="btn">Cambiar contraseña</button>
        </form>
    </main>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión – Impulso</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="./estilos.css">
    <script src="./main.js" defer></script>
</head>
<body>

    <!-- Fondo decorativo -->
    <div class="background" aria-hidden="true">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <main>
        <!-- Lado izquierdo: bienvenida -->
        <section class="hero">
            <a href="../landing_page/index.html" class="brand" aria-label="Impulso, ir al inicio">
                <img src="../img/logo-removebg-preview.png" alt="" >
                Impulso
            </a>

            <div class="hero-content">
                <h1 id="heroMessage" aria-label="¡Bienvenido!">
                    <span id="heroMessageText" aria-hidden="true">¡Bienvenido!</span>
                </h1>
            </div>
        </section>

        <!-- Lado derecho: formulario -->
        <section class="login-side">
            <button class="theme-toggle" id="themeToggle" type="button"></button>

            <div class="login">
                <h2>Iniciar sesión</h2>
                <p class="login-description">
                    Ingresá tus credenciales para continuar a tu cuenta.
                </p>

                <form id="loginForm" novalidate>
                    <div class="form-group">
                        <label for="email">Correo electrónico</label>
                        <input
                            type="email"
                            id="email"
                            placeholder="tu@email.com"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <div class="input-container">
                            <input
                                type="password"
                                id="password"
                                placeholder="••••••••••"
                                autocomplete="current-password"
                                required
                            >
                            <button
                                type="button"
                                class="show-password"
                                id="showPassword"
                                aria-controls="password"
                            >Ver</button>
                        </div>
                    </div>

                    <div class="options">
                        <label class="remember">
                            <input type="checkbox" id="remember">
                            Recordarme
                        </label>
                        <a href="../recuperar/olvido.html">¿Olvidaste tu contraseña?</a>
                    </div>

                    <p class="form-error" id="formError" role="alert" hidden></p>

                    <button type="submit" class="login-button" id="loginButton">
                        Iniciar sesión
                    </button>
                </form>

                <div class="separador"><span>o</span></div>

                <a href="/api/auth/google" class="google-button">
                    <svg viewBox="0 0 48 48" aria-hidden="true">
                        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                    </svg>
                    Continuar con Google
                </a>
                
                <p class="register">
                    ¿Todavía no tenés cuenta?
                    <a href="../registro/index.html">Crear cuenta</a>
                </p>
            </div>
        </section>
    </main>
<script>
        /* Aplica el tema guardado antes de pintar la página (evita el parpadeo) */
        (function () {
            try {
                var guardado = localStorage.getItem("tema");
                var sistemaOscuro = window.matchMedia("(prefers-color-scheme: dark)").matches;
                if (guardado === "oscuro" || (!guardado && sistemaOscuro)) {
                    document.documentElement.classList.add("oscuro");
                }
            } catch (e) {}
        })();
    </script>
</body>
</html>

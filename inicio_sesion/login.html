<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión – Impulso</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="./estilos.css">
    <script src="./main.js" defer></script>
</head>
<body>

    <!-- Fondo decorativo -->
    <div class="background" aria-hidden="true">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <main>
        <!-- Lado izquierdo: bienvenida -->
        <section class="hero">
            <a href="../landing_page/index.html" class="brand" aria-label="Impulso, ir al inicio">
                <img src="../img/logo-removebg-preview.png" alt="" >
                Impulso
            </a>

            <div class="hero-content">
                <h1 id="heroMessage" aria-label="¡Bienvenido!">
                    <span id="heroMessageText" aria-hidden="true">¡Bienvenido!</span>
                </h1>
            </div>
        </section>

        <!-- Lado derecho: formulario -->
        <section class="login-side">
            <button class="theme-toggle" id="themeToggle" type="button"></button>

            <div class="login">
                <h2>Iniciar sesión</h2>
                <p class="login-description">
                    Ingresá tus credenciales para continuar a tu cuenta.
                </p>

                <form id="loginForm" novalidate>
                    <div class="form-group">
                        <label for="email">Correo electrónico</label>
                        <input
                            type="email"
                            id="email"
                            placeholder="tu@email.com"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <div class="input-container">
                            <input
                                type="password"
                                id="password"
                                placeholder="••••••••••"
                                autocomplete="current-password"
                                required
                            >
                            <button
                                type="button"
                                class="show-password"
                                id="showPassword"
                                aria-controls="password"
                            >Ver</button>
                        </div>
                    </div>

                    <div class="options">
                        <label class="remember">
                            <input type="checkbox" id="remember">
                            Recordarme
                        </label>
                        <a href="#">¿Olvidaste tu contraseña?</a>
                    </div>

                    <p class="form-error" id="formError" role="alert" hidden></p>

                    <button type="submit" class="login-button" id="loginButton">
                        Iniciar sesión
                    </button>
                </form>

                <p class="register">
                    ¿Todavía no tenés cuenta?
                    <a href="../registro/index.html">Crear cuenta</a>
                </p>
            </div>
        </section>
    </main>
<script>
        /* Aplica el tema guardado antes de pintar la página (evita el parpadeo) */
        (function () {
            try {
                var guardado = localStorage.getItem("tema");
                var sistemaOscuro = window.matchMedia("(prefers-color-scheme: dark)").matches;
                if (guardado === "oscuro" || (!guardado && sistemaOscuro)) {
                    document.documentElement.classList.add("oscuro");
                }
            } catch (e) {}
        })();
    </script>
</body>
</html>

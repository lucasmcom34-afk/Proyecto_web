                Impulso
            </a>

            <button class="theme-toggle" id="themeToggle" type="button"></button>

            <div class="header">
                <span class="eyebrow">CREAR CUENTA</span>
                <h1>Empezá con Impulso.</h1>
                <p>Creá tu cuenta y empezá a ordenar tu emprendimiento.</p>
            </div>

            <form id="registerForm" class="register-form">
                <div class="form-group">
                    <label for="name">Nombre completo</label>
                    <input type="text" id="name" name="name" placeholder="Juan Pérez" autocomplete="name" required>
                </div>

                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" placeholder="tu@email.com" autocomplete="email" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <div class="input-wrapper">
                            <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="new-password" minlength="8" required>
                            <button class="password-toggle" type="button" data-target="password">Mostrar</button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Repetir contraseña</label>
                        <div class="input-wrapper">
                            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••" autocomplete="new-password" minlength="8" required>
                            <button class="password-toggle" type="button" data-target="confirmPassword">Mostrar</button>
                        </div>
                    </div>
                </div>

                <label class="terms">
                    <input type="checkbox" id="terms" required>
                    <span>Acepto los términos y condiciones.</span>
                </label>

                <p id="formMessage" class="form-message" role="alert" hidden></p>

                <button class="submit-button" id="submitButton" type="submit">
                    Crear cuenta <span aria-hidden="true">→</span>
                </button>

                <p class="login-link">
                    ¿Ya tenés una cuenta?
                    <a href="../inicio_sesion/login.html">Iniciar sesión</a>
                </p>
            </form>
        </section>

        <!-- PANEL DERECHO -->
        <aside class="visual-panel">
            <div class="blob blob-1" aria-hidden="true"></div>
            <div class="blob blob-2" aria-hidden="true"></div>
            <div class="blob blob-3" aria-hidden="true"></div>

            <div class="visual-content">
                <span class="visual-badge">TU NEGOCIO</span>
                <h2>Todo en un<br>solo lugar.</h2>

                <ul class="feature-list">
                    <li class="feature"><span class="feature-icon" aria-hidden="true">✓</span>Finanzas, inventario y ventas conectados</li>
                    <li class="feature"><span class="feature-icon" aria-hidden="true">✓</span>Tareas y clientes siempre a mano</li>
                    <li class="feature"><span class="feature-icon" aria-hidden="true">✓</span>Listo en 5 minutos, sin instalar nada</li>
                </ul>
            </div>
        </aside>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impulbot | Impulso</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="../dashboard/appearance.js"></script>
    <link rel="stylesheet" href="../dashboard/styleIni.css">
    <link rel="stylesheet" href="chatbot.css">
    <script src="chatbot.js" defer></script>
</head>
<body class="pagina-chatbot">
    <header>
        <nav aria-label="Navegación principal">
            <a href="../dashboard/dashboard.html">Inicio</a>
            <a href="../inventario/inventario.html">Inventario</a>
            <a href="../historialRegistros/registros.html">Registros</a>
            <a href="../rendimiento/rendimiento.html">Rendimiento</a>
            <a class="enlace-impulbot" href="chatbot.html" aria-current="page">
                <span>Impulbot</span>
                <img class="icono-impulbot" src="../img/bot.webp" alt="">
            </a>
        </nav>
    </header>
    <main class="ventana-chat" aria-label="Conversación con Impulbot">
        <div class="encabezado-chat">
            <img class="avatar-chat" src="../img/bot.webp" alt="">
            <div>
                <h1>Impulbot</h1>
                <p>Asistente de Impulso</p>
            </div>
        </div>
        <div class="conversacion-chat" id="conversacionChat" role="log" aria-label="Mensajes del chat"></div>
        <form class="entrada-chat" id="formularioChat">
            <input
                id="mensajeChat"
                name="mensaje"
                type="text"
                placeholder="Saludá a Impulbot..."
                aria-label="Escribí tu mensaje para Impulbot"
                autocomplete="off"
                disabled
            >
            <button type="submit" aria-label="Enviar mensaje" disabled>
                <svg aria-hidden="true" viewBox="0 0 24 24">
                    <path d="M2.01 21 23 12 2.01 3 2 10l15 2-15 2z"></path>
                </svg>
            </button>
        </form>
    </main>
</body>
</html>
